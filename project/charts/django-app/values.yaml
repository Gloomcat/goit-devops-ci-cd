# Image settings
image:
  repository: ""   # e.g. 123456789012.dkr.ecr.eu-north-1.amazonaws.com/devops-ci-cd-ecr
  tag: 8861b77
  pullPolicy: IfNotPresent

# Service settings
service:
  type: LoadBalancer
  port: 80
  targetPort: 8000

# Replica / HPA settings
replicaCount: 1
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70

# Deployment update strategy (no surge to fit small clusters)
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 0
    maxUnavailable: 1


# ConfigMap values (non-secret env)
# Configure Django to use PostgreSQL (Postgres or Aurora-PostgreSQL)
config:
  DJANGO_DEBUG: "false"
  DJANGO_ALLOWED_HOSTS: "*"
  DATABASE_ENGINE: "django.db.backends.postgresql"
  DATABASE_HOST: ""
  DATABASE_PORT: "5432"
  DATABASE_NAME: ""
  DATABASE_USER: ""
  DATABASE_PASSWORD: ""
  # Optional: if your app supports it, you can set DATABASE_URL instead
  DATABASE_URL: ""
